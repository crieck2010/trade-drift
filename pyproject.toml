[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-drift"
version = "0.1.0"
description = "Canonical model-drift detection: realized paper/live behavior vs backtest expectations, graded OK/WATCH/VIOLATION."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "crieck2010" }]
keywords = ["trading", "drift-detection", "model-monitoring", "statistics", "quantitative-finance"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
trade-drift = "trade_drift.cli:main"

[project.urls]
Homepage = "https://github.com/crieck2010/trade-drift"
Repository = "https://github.com/crieck2010/trade-drift"

[tool.setuptools.packages.find]
where = ["src"]
